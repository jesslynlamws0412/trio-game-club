# 每 5 分钟访问一次网站，避免 Render 免费版因为 15 分钟没人访问而休眠。
# GitHub 的定时任务有时会延迟几分钟，所以建议再配合 UptimeRobot（见 docs/部署指南.md）。
name: keep-awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          curl --silent --show-error --fail --location \
            --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            https://trio-game-club.onrender.com/healthz
